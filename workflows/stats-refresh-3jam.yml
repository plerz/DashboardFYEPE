name: DashboardFYEPE statistics every 3 hours WIB
on:
  schedule:
    # 02:30, 05:30, 08:30, 11:30, 14:30, 17:30, 20:30, 23:30 WIB
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue statistics refresh (never wait for TikTok API work)
        env:
          APP_URL: ${{ secrets.DASHFYEPE_APP_URL }}
          CRON_TOKEN: ${{ secrets.STATS_CRON_TOKEN }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_TOKEN"
          curl --fail-with-body --show-error --silent --max-time 35 --retry 2 --retry-delay 5 \
            -X POST "${APP_URL%/}/internal/stats/schedule-refresh" \
            -H "X-Stats-Cron-Token: $CRON_TOKEN"
