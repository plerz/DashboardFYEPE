<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — DashFYEPE</title><link rel="stylesheet" href="/static/style.css"><style>body{display:grid;place-items:center;min-height:100vh;background:#f4f7fb}.login{width:min(430px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;box-shadow:0 15px 50px rgba(16,36,60,.1)}.brand2{font-size:27px;font-weight:900;color:#10243c}.sub{color:#667085;margin:7px 0 25px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}.submit{width:100%;padding:13px;border:0;border-radius:10px;background:#1769ff;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.hint{margin-top:18px;font-size:12px;color:#98a2b3;line-height:1.5}</style></head><body><div class="login"><div class="brand2">DashFYEPE</div><div class="sub">Login untuk mengakses dashboard</div>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="next" value="{{request.args.get('next','')}}"><div class="field"><label>Username</label><input name="username" autocomplete="username" required></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="submit">Masuk</button></form><div class="hint">Akun memiliki tiga level: Super Admin, Admin Medsos, dan Customer.</div></div></body></html>
